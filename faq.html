<body data-title="{field} 자주 묻는 질문" data-desc="{name}의 업무 범위, 소요 시간, 진행 과정, 문의 방법에 대한 질문과 답변입니다.">
<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div id="hero-bg" aria-hidden="true"><span class="blob blob--1"></span><span class="grain"></span></div>
    <div class="container">
      <nav class="breadcrumb" aria-label="현재 위치"><a href="index.html">홈</a><span>/</span><span>자주 묻는 질문</span></nav>
      <p class="overline rise">FAQ</p>
      <h1 class="rise">문의 전에 많이 묻는 질문</h1>
      <p class="lead rise">질문을 누르면 답변이 펼쳐집니다. 찾는 답이 없다면 이메일로 편하게 물어봐 주세요.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container split">
      <div class="sticky">
        <div class="media ratio-1 reveal" data-file="space-2.jpg">
          <img src="images/space-2.jpg" alt="업무 공간 사진" loading="lazy" onerror="this.parentNode.classList.add('is-empty')">

      </div>

        <div class="btn-row">
          <a class="btn btn-primary" data-mail data-icon="mail">이메일로 질문하기</a>
          <a class="btn btn-ghost" href="services.html">대표 업무 비교하기</a>

      </div>
    </div>

<footer id="site-footer"></footer>
