<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대표 업무 2 안내</title>
<meta name="description" content="대표 업무 2의 대상, 제공 내용, 범위, 소요 시간, 진행 과정과 준비사항을 안내합니다.">
<link rel="canonical" href="service-2.html">
<meta property="og:type" content="website">
<meta property="og:title" content="대표 업무 2 안내">
<meta property="og:description" content="대표 업무 2의 대상, 제공 내용, 범위, 소요 시간, 진행 과정과 준비사항을 안내합니다.">
<meta property="og:url" content="service-2.html">
<meta property="og:image" content="images/og.jpg">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<!-- data-service 숫자가 config.js 의 대표 업무 순서입니다 -->
<body data-service="2" data-title="{region} {svc} 업무 안내" data-desc="{region} {name}의 {svc} 업무 범위, 소요 시간, 진행 과정과 준비사항을 안내합니다.">
<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div id="hero-bg" aria-hidden="true"><span class="blob blob--1"></span><span class="grain"></span></div>
    <div class="container hero-grid">
      <div>
        <nav class="breadcrumb" aria-label="현재 위치"><a href="index.html">홈</a><span>/</span><a href="services.html">대표 업무</a></nav>
        <p class="overline rise" data-k="region" data-ph="지역"></p>
        <h1 class="rise" data-k="svc.name" data-ph="대표 업무 이름"></h1>
        <p class="lead rise" data-k="svc.summary" data-ph="한 줄 소개"></p>
        <div class="btn-row rise"><a class="btn btn-primary" data-mail data-icon="mail"><span data-svc-name></span> 문의하기</a></div>
      </div>
      <div class="media ratio-3-2 reveal" data-file="service-2.jpg">
        <img src="images/service-2.jpg" alt="업무를 진행하는 모습" onerror="this.parentNode.classList.add('is-empty')">
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="sec-head"><p class="overline">Overview</p><h2>이 업무가 필요한 분과 해결하는 고민</h2></div>
      <div class="info-grid">
        <div class="info-item" data-opt-row><h3>필요한 분</h3><p data-k="svc.for" data-ph="필요한 분"></p></div>
        <div class="info-item" data-opt-row><h3>대표 고민</h3><p data-k="svc.pain" data-ph="대표 고민"></p></div>
        <div class="info-item" data-opt-row><h3>제공 내용</h3><p data-k="svc.offer" data-ph="제공 내용"></p></div>
        <div class="info-item" data-opt-row><h3>포함 사항</h3><p data-k="svc.includes" data-ph="포함 사항"></p></div>
      </div>
    </div>
  </section>

  <section class="section section--soft" data-opt>
    <div class="container">
      <div class="sec-head"><p class="overline">Scope &amp; time</p><h2>업무 범위와 소요 시간</h2></div>
      <div class="info-grid">
        <div class="info-item" data-opt-row><h3>업무 범위</h3><p data-k="svc.scope" data-ph="기본 업무 범위"></p></div>
        <div class="info-item" data-opt-row><h3>예상 소요 시간</h3><p data-k="svc.time" data-ph="예상 소요 시간"></p></div>
        <div class="info-item" data-opt-row><h3>별도 협의 기준</h3><p data-k="svc.extra" data-ph="범위·일정이 달라지는 기준"></p></div>
      </div>
    </div>
  </section>

  <section class="section" data-opt>
    <div class="container">
      <div class="sec-head"><p class="overline">Process</p><h2>진행 과정</h2></div>
      <div class="steps" data-render="process"></div>
    </div>
  </section>

  <section class="section section--soft" data-opt>
    <div class="container">
      <div class="sec-head"><p class="overline">Before you start</p><h2>문의 전에 확인해 주세요</h2></div>
      <div class="info-grid">
        <div class="info-item" data-opt-row><h3>준비사항</h3><p data-k="svc.prepare" data-ph="처음 문의할 때 준비하면 좋은 것"></p></div>
        <div class="info-item" data-opt-row><h3>주의사항</h3><p data-k="svc.caution" data-ph="주의사항"></p></div>
      </div>
    </div>
  </section>

  <!-- 업무별 질문은 config.js 의 services[n].faq 에 { q: "", a: "" } 로 넣으면 나타납니다 -->
  <section class="section" data-opt>
    <div class="container">
      <div class="sec-head"><p class="overline">FAQ</p><h2>이 업무에 대해 자주 묻는 질문</h2></div>
      <div class="faq" data-render="faq" data-src="svc"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta-band reveal">
        <h2><span data-svc-name></span>, 필요한 범위와 일정을 알려 주세요</h2>
        <p data-k="hours" data-ph="문의 가능 시간"></p>
        <div class="btn-row"><a class="btn btn-primary" data-mail data-icon="mail"><span data-svc-name></span> 문의하기</a></div>
      </div>
      <div class="next-links" style="margin-top:48px" data-render="other-services"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
