<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의·위치</title>
<meta name="description" content="대표 이메일, 사무실 위치, 문의 가능 시간과 문의 방법을 안내합니다.">
<link rel="canonical" href="contact.html">
<meta property="og:type" content="website">
<meta property="og:title" content="문의·위치">
<meta property="og:description" content="대표 이메일, 사무실 위치, 문의 가능 시간과 문의 방법을 안내합니다.">
<meta property="og:url" content="contact.html">
<meta property="og:image" content="images/og.jpg">
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="{region} {name} 문의·위치" data-desc="{name} 대표 이메일 {email}, 위치 {address}, 문의 가능 시간 {hours}.">
<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div id="hero-bg" aria-hidden="true"><span class="blob blob--1"></span><span class="grain"></span></div>
    <div class="container">
      <nav class="breadcrumb" aria-label="현재 위치"><a href="index.html">홈</a><span>/</span><span>문의·위치</span></nav>
      <p class="overline rise">Contact</p>
      <h1 class="rise">이메일 한 통으로 시작합니다</h1>
      <p class="lead rise" data-k="contactMethod" data-ph="문의 방법 — 무엇을 적어 보내면 되는지, 답장은 어떻게 오는지"></p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container profile">
      <div class="contact-card reveal">
        <p class="overline">Email</p>
        <div data-opt-row><a class="contact-email" data-mail data-k="email" data-ph="대표 이메일"></a></div>
        <dl class="meta-list">
          <div data-opt-row><dt>소속·이름</dt><dd data-k="name" data-ph="소속·내 이름"></dd></div>
          <div data-opt-row><dt>직책·역할</dt><dd data-k="role" data-ph="직책·역할"></dd></div>
          <div data-opt-row><dt>위치</dt><dd data-k="address" data-ph="사무실·연구소 위치 (공개 가능한 것만)"></dd></div>
          <div data-opt-row><dt>문의 가능 시간</dt><dd data-k="hours" data-ph="문의 가능 시간"></dd></div>
        </dl>
        <div class="btn-row"><a class="btn btn-primary" data-mail data-icon="mail">이메일로 문의하기</a></div>
      </div>
      <div class="media ratio-4-5 reveal" data-file="space-2.jpg">
        <img src="images/space-2.jpg" alt="사무실 공간 사진" loading="lazy" onerror="this.parentNode.classList.add('is-empty')">
      </div>
    </div>
  </section>

  <!-- 지도는 네이버 지도·플레이스 주소를 입력한 경우에만 아래 채널 버튼으로 연결됩니다 -->
  <section class="section section--soft" data-opt>
    <div class="container">
      <div class="sec-head"><p class="overline">Channels</p><h2>다른 채널에서도 만나요</h2></div>
      <div class="channels" data-render="channels"></div>
    </div>
  </section>

  <section class="section" data-opt>
    <div class="container">
      <div class="sec-head"><p class="overline">Process</p><h2>문의 후에는 이렇게 진행됩니다</h2></div>
      <div class="steps" data-render="process"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container next-links">
      <a class="next-link" href="services.html" data-icon-after="arrow"><span><small>문의 전에</small>대표 업무 비교하기</span></a>
      <a class="next-link" href="faq.html" data-icon-after="arrow"><span><small>궁금한 점</small>자주 묻는 질문</span></a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
